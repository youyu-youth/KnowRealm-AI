[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "deepagents>=0.7.13,<0.8",
    "fastapi>=0.141.1",
    "filelock>=3,<4",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain>=1.3,<1.4",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-sqlite>=3,<4",
    "loguru>=0.7.3",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.8",
    "trafilatura>=2.2,<3",
    "tzdata>=2026.3",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "httpx>=0.28.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
